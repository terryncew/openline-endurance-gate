name: agent-successor-benchmark

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Normalize release checkout
        run: python scripts/prepare_release_checkout.py --apply .
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Unit and adversarial tests
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q
      - name: Hostile self-test
        run: python scripts/successor_benchmark_selftest.py
      - name: Verify sealed release closure
        if: matrix.python-version == '3.12'
        run: python scripts/verify_release.py --root .
      - name: Release checks
        if: matrix.python-version == '3.12'
        run: python scripts/release_check.py
