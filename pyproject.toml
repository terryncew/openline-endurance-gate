[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openline-endurance-gate"
version = "0.13.0rc2"
description = "A receiver-side benchmark for comparing a current agent with a candidate under fixed tasks, constraints, budgets, and evidence rules."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Terrynce White"}]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
openline-endurance = "openline_endurance_gate.cli:main"
agent-successor-benchmark = "openline_endurance_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["openline_endurance_gate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_files = ["test_successor_benchmark.py"]
